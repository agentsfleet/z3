name: build-test

on: [push]

jobs:
  build:
    runs-on: codeberg-tiny
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - uses: https://codeberg.org/mlugg/setup-zig@v2

      - name: Run tests
        run: zig build test

      - name: Run integration tests
        run: zig build integration-test
